  <body class="login-page" style="overflow: hidden; ">


    
    <div class="login-box">
      <div id="headerbox">
        <img alt="Venture Logo" src="../resources/V-BGremoved.png" id="logov" />
        <h2 id="venture-login">Login to Venture</h2>
      </div>

      <!-- email + pass -->
      <div id="userpassfield">
        <label for="email" style="text-align: left">Email</label>
        <input
          type="email"
          id="email"
          placeholder="ie: cheesechomper@example.com"
        />
        <label for="password" style="text-align: left">Password</label>
        <input type="password" id="password" placeholder="ie: password123" />
        <div id="form-actions" style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
          <a href="/register/" onclick="event.preventDefault(); go('/register/');" style="color: var(--accent); text-decoration: underline; font-weight: 500;">Create an account</a>
          <button type="button" id="forgot-password-link" style="background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; padding: 0; font-weight: 500;">Forgot password?</button>
        </div>
        <p id="form-error" style="color: var(--danger); font-size: 13px; margin: 8px 0 0 0; display: none;"></p>
        <button type="button" class="login-btn" id="submitform">Login</button>
      </div>

      <!-- divider -->
      <div id="linebox">
        <div class="line"></div>
        <p>or sign in with</p>
        <div class="line"></div>
      </div>

      <!-- oauth buttons -->
      <div id="oauthbuttons">
      <button id="GoogleBtn" class="oauth-btn google">
        <img
          src="https://developers.google.com/identity/images/g-logo.png"
          alt="Google logo"
        />
        <span>Google</span>
      </button>

      <button id="GithubBtn" class="oauth-btn github">
        <img
          src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png"
          alt="GitHub logo"
        />
        <span>GitHub</span>
      </button>
    </div>
      <p class="error" id="error"></p>
    </div>
          <div id="turnstile-widget"
    class="cf-turnstile"
    data-sitekey="0x4AAAAAADAHomeeHOWWlMfW"
    data-theme="light"
    data-size="flexible"
    data-callback="onTurnstileSuccess"
    data-error-callback="onTurnstileError"
    data-expired-callback="onTurnstileExpired"
  ></div>

    <script>
          const TURNSTILE_VERIFY_URL = "https://venture.amirmechkour5474.workers.dev/"; // <- replace with your worker URL
          const submitform = document.getElementById("submitform");
          if (submitform) submitform.disabled = true; // Disable the submit button by default
          const registerBtn = document.getElementById("registerBtn");
          if (registerBtn) registerBtn.disabled = true; // Disable the register button by default

    async function onTurnstileSuccess(token) {
      // Local development bypass: enable buttons without verifying Turnstile.
      // Safe because this only triggers on localhost/127.0.0.1/::1.
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '::1') {
        console.log('Local dev: enabling submit/register (Turnstile bypass).');
        if (document.getElementById("submitform")) document.getElementById("submitform").disabled = false;
        if (document.getElementById("registerBtn")) document.getElementById("registerBtn").disabled = false;
        return;
      }

      console.log("Turnstile success:", token);
      try {
        const resp = await fetch(TURNSTILE_VERIFY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await resp.json();
        if (data && data.success) {
          if (document.getElementById("submitform")) document.getElementById("submitform").disabled = false;
          if (document.getElementById("registerBtn")) document.getElementById("registerBtn").disabled = false;
        } else {
          console.error('Turnstile verification failed', data);
          if (document.getElementById("submitform")) document.getElementById("submitform").disabled = true;
          if (document.getElementById("registerBtn")) document.getElementById("registerBtn").disabled = true;
        }
      } catch (e) {
        console.error('Verify request failed', e);
        if (document.getElementById("submitform")) document.getElementById("submitform").disabled = true;
        if (document.getElementById("registerBtn")) document.getElementById("registerBtn").disabled = true;
      }
    }
    function onTurnstileError(errorCode) {
      console.error("Turnstile error:", errorCode);
      document.getElementById("submitform").disabled = true;
      document.getElementById("registerBtn").disabled = true;
    }
    function onTurnstileExpired() {
      console.warn("Turnstile token expired");
      document.getElementById("submitform").disabled = true;
      document.getElementById("registerBtn").disabled = true;
    }

      </script>
